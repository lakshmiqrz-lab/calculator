<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
  <link rel="stylesheet" href="./style.css">
  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

<div class="main">
    <div style="margin-top: 50px;">
        <input type="text" id="output" class="input" placeholder="0">
    </div>

    <div class="buttons">
        <div class="row">
            <button class="orange" id="clear" onclick="clearAll()">AC</button>
            <button class="orange" id="remove" onclick="removeLatItem()"><i class="fa-solid fa-delete-left"></i></button>
            <button class="orange" onclick="displayData('%')">%</button>
            <button class="orange" onclick="displayData('/')"><i class="fa-solid fa-divide"></i></button>
        </div>

        <div class="row">
            <button class="seven" onclick="displayData('7')">7</button>
            <button class="eight" onclick="displayData('8')">8</button>
            <button class="nine" onclick="displayData('9')">9</button>
            <button class="orange" id="multiply" onclick="displayData('*')"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="row">
            <button class="four" onclick="displayData('4')">4</button>
            <button class="five" onclick="displayData('5')">5</button>
            <button class="six" onclick="displayData('6')">6</button>
            <button class="orange" id="minus" onclick="displayData('-')">-</button>
        </div>

        <div class="row">
            <button class="one" onclick="displayData('1')">1</button>
            <button class="two" onclick="displayData('2')">2</button>
            <button class="three" onclick="displayData('3')">3</button>
            <button class="orange" id="add" onclick="displayData('+')">+</button>
        </div>

        <div class="row">
            <button class="zero" onclick="displayData('0')">0</button>
            <button class="dot" onclick="displayData('.')">.</button>
            <button class="orange" id="equal" onclick="result()">=</button>
        </div>
    </div>
</div>

</body>
<script src="./script.js"></script>
</html>
